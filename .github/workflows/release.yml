name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Compile Extension
        run: npm run compile

      - name: Get Version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if Release Already Exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.version.outputs.version }} already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package VSIX
        if: steps.release_check.outputs.exists == 'false'
        run: npx @vscode/vsce package

      - name: Get VSIX Filename
        if: steps.release_check.outputs.exists == 'false'
        id: vsix
        run: |
          echo "file=$(ls *.vsix | head -n 1)" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: ${{ steps.vsix.outputs.file }}
          generate_release_notes: true

      # # Optional: Publish to VS Code Marketplace
      # # Requires GitHub Secret: VSCE_PAT
      # - name: Publish to VS Code Marketplace
      #   if: steps.release_check.outputs.exists == 'false'
      #   run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
