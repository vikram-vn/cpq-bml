<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!-- Terminal Window Body -->
  <rect x="0.8" y="1.2" width="14.4" height="13.6" rx="2.5" fill="url(#clrGrad)"/>
  
  <!-- Terminal Prompt Chevron > -->
  <path d="M3.8 5.2L6.6 8L3.8 10.8" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Terminal Cursor _ -->
  <line x1="8.2" y1="10.8" x2="11.2" y2="10.8" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Clear Badge (Minus Badge) -->
  <circle cx="12.4" cy="12.2" r="3.4" fill="#ef4444" stroke="#0f172a" stroke-width="1.2"/>
  <path d="M10.8 12.2H14" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <defs>
    <linearGradient id="clrGrad" x1="0.8" y1="1.2" x2="15.2" y2="14.8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
</svg>
