<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <defs>
    <linearGradient id="depGrad" x1="4" y1="2" x2="15" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="5" y1="11" x2="1" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Left Fin -->
  <path d="M5.0 7.0 L1.5 8.5 L2.2 11.5 L3.8 10.0 Z" fill="#ef4444"/>
  
  <!-- Right Fin -->
  <path d="M9.0 11.0 L7.5 14.5 L4.5 13.8 L6.0 12.2 Z" fill="#ef4444"/>

  <!-- Exhaust Flame -->
  <path d="M4.0 10.4 C3.2 11.5 2.2 12.5 0.8 15.2 C3.5 13.8 4.5 12.8 5.6 12.0 Z" fill="url(#flameGrad)"/>

  <!-- Rocket Body -->
  <path d="M15.2 0.8 C11.5 1.5 6.0 5.0 3.8 10.0 L6.0 12.2 C11.0 10.0 14.5 4.5 15.2 0.8 Z" fill="url(#depGrad)"/>

  <!-- Porthole Window -->
  <circle cx="10" cy="6" r="2.0" fill="#ffffff"/>
  <circle cx="10" cy="6" r="1.3" fill="#0284c7"/>
</svg>
