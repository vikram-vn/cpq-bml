<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <defs>
    <linearGradient id="commGrad" x1="4" y1="2" x2="15" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="commFlame" x1="5" y1="11" x2="1" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde047"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Left Fin -->
  <path d="M5.0 7.0 L1.5 8.5 L2.2 11.5 L3.8 10.0 Z" fill="#dc2626"/>
  
  <!-- Right Fin -->
  <path d="M9.0 11.0 L7.5 14.5 L4.5 13.8 L6.0 12.2 Z" fill="#dc2626"/>

  <!-- Exhaust Flame -->
  <path d="M4.0 10.4 C3.2 11.5 2.2 12.5 0.8 15.2 C3.5 13.8 4.5 12.8 5.6 12.0 Z" fill="url(#commFlame)"/>

  <!-- Rocket Body -->
  <path d="M15.2 0.8 C11.5 1.5 6.0 5.0 3.8 10.0 L6.0 12.2 C11.0 10.0 14.5 4.5 15.2 0.8 Z" fill="url(#commGrad)"/>

  <!-- Porthole Window -->
  <circle cx="10" cy="6" r="2.0" fill="#ffffff"/>
  <circle cx="10" cy="6" r="1.3" fill="#ea580c"/>

  <!-- Commerce Badge (Process / Cog at lower right) -->
  <circle cx="12.5" cy="12.5" r="3.2" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <path d="M11.2 12.5H13.8M12.5 11.2V13.8" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
</svg>
