<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
  <!-- Lens Glass tint -->
  <circle cx="6.2" cy="6.2" r="4.9" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- Magnifying Glass Lens Rim -->
  <circle cx="6.2" cy="6.2" r="4.9" stroke="#60a5fa" stroke-width="1.3"/>

  <!-- Glass Reflection Glint (white arc at top-left) -->
  <path d="M3.4 4.8 C3.8 3.6 4.8 2.8 6.0 2.6" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Original Bug scaled to fit comfortably inside the glass with space around -->
  <g transform="translate(6.2, 6.3) scale(0.49) translate(-8, -7.65)">
    <!-- Legs -->
    <path d="M5 6.5 C3.8 6, 3.2 5, 2.5 4.2" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M11 6.5 C12.2 6, 12.8 5, 13.5 4.2" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M4.5 9 H2.2" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M11.5 9 H13.8" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M5 11.5 C3.8 12, 3.2 13, 2.5 13.8" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M11 11.5 C12.2 12, 12.8 13, 13.5 13.8" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Antennae -->
    <path d="M7 3 C6.6 1.8, 5.8 1.6, 5 1.5" stroke="#ea580c" stroke-width="1" stroke-linecap="round"/>
    <path d="M9 3 C9.4 1.8, 10.2 1.6, 11 1.5" stroke="#ea580c" stroke-width="1" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="8" cy="3.5" r="1.6" fill="#ea580c"/>

    <!-- Left wing shell -->
    <path d="M7.5 5 C5.2 5, 4.2 6.5, 4.2 9 C4.2 11.2, 5.2 13, 7.5 13 Z" fill="url(#orangeGrad)"/>
    <!-- Right wing shell -->
    <path d="M8.5 5 C10.8 5, 11.8 6.5, 11.8 9 C11.8 11.2, 10.8 13, 8.5 13 Z" fill="url(#orangeGrad)"/>
  </g>

  <!-- Handle -->
  <path d="M9.8 9.8 L14.2 14.2" stroke="#60a5fa" stroke-width="2.3" stroke-linecap="round"/>

  <defs>
    <linearGradient id="orangeGrad" x1="4.2" y1="5" x2="11.8" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
</svg>
